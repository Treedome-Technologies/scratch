# Bot reports: the Treedome bots' scripted reports on pull requests, after ci finishes.
name: bot-reports

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions: {}

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      actions: read
      pull-requests: read
    uses: Treedome-Technologies/.github/.github/workflows/bot-reports-shared.yml@ec89198fd4c11eeaf2ea96b2049ef5131f066938 # main, to become v1.0.0
    secrets: inherit
